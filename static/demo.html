<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Банк</title>
<style>
  :root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}
  html,body{width:100%;height:100%;margin:0}
  body{background:#0D1117 url('/static/bank-logo.jpg') center 58% / min(520px,55vw) auto no-repeat;overflow:hidden;background-blend-mode:screen;color:#f2f5f7}
  .welcome{position:absolute;top:50%;left:clamp(28px,7.5vw,114px);transform:translateY(-50%);width:min(370px,calc(100vw - 56px))}
  .eyebrow{margin:0 0 17px;color:#53d7d2;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  h1{margin:0 0 18px;font-size:clamp(32px,4vw,54px);line-height:1.04;letter-spacing:-.04em}
  .welcome p{margin:0 0 27px;color:#aebbc5;font-size:17px;line-height:1.6}
  .wiki-link{display:inline-flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #39c6c2;color:#65e1dc;font-size:15px;font-weight:700;text-decoration:none;transition:color .2s,border-color .2s,transform .2s}
  .wiki-link:hover{border-color:#71e6e1;color:#b0fffb;transform:translateX(3px)}
  .wiki-link:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .wiki-link::after{content:"→";font-size:18px;line-height:1}
  @media (max-width:900px){
    body{background-position:center 28%;background-size:min(360px,55vw)}
    .welcome{top:auto;bottom:28px;left:28px;transform:none;width:min(390px,calc(100vw - 56px))}
  }
  @media (max-width:520px){
    body{background-position:center 18%;background-size:260px auto}
    .welcome{left:16px;bottom:16px;width:calc(100vw - 32px)}
    .welcome p{font-size:14px}
  }
</style>
</head>
<body>
  <main class="welcome">
    <p class="eyebrow">Локальный помощник по регламентам</p>
    <h1>Добро пожаловать в BankAssistant</h1>
    <p>Разбирайтесь в требованиях Инструкции, находите нужные пункты и переходите к подготовке документов в одном рабочем пространстве.</p>
    <a class="wiki-link" href="/wiki#">Открыть базу знаний</a>
  </main>
  <script
    src="/static/widget.js"
    async
    data-title="Банк"
    data-theme="dark"
    data-open="true"></script>
</body>
</html>

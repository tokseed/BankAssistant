services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      AUTH_TOKENS: ${AUTH_TOKENS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SESSION_TTL: "1800"
    volumes:
      - ./kb:/srv/kb          # база знаний вне образа: новые версии Инструкции без пересборки
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Локальная LLM: запускается только с профилем llm. Данные не покидают сервер.
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  caddy_data:
  caddy_config:
  ollama:
